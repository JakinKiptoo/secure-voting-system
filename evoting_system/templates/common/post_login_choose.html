<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Choose a dashboard — Kenyan Electronic Voting System</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { gov: { forest: '#0E3929', dark: '#08251B', hover: '#0A2D20', accent: '#86EFAC', surface: '#F8FAFA', border: '#E2E8F0' } },
    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
  } } };
</script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
</head>
<body class="h-full flex flex-col bg-[#F8FAFA] text-slate-800 antialiased font-sans">
<main class="flex-1 flex items-center justify-center p-6">
<div class="bg-white rounded-2xl shadow-[0_18px_40px_-12px_rgba(15,23,42,0.08)] border border-slate-200/90 p-8 sm:p-10 max-w-[460px] w-full">
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-100/90 border border-slate-200 text-[11px] font-medium text-slate-600 mb-4">This account holds both the Official and Auditor roles</span>
<h1 class="text-xl font-bold text-slate-900 tracking-tight mb-1.5">Choose a dashboard</h1>
<p class="text-sm text-slate-500 mb-6">Pick which dashboard to use for this session.</p>

<div class="space-y-3">
<a class="w-full bg-[#0E3929] hover:bg-[#144834] text-white rounded-xl py-3.5 px-5 font-semibold text-sm flex items-center justify-between transition-all shadow-md shadow-emerald-950/15" href="{% url 'officials:dashboard' %}">
<span>Officials Dashboard</span>
<svg class="w-4 h-4 text-emerald-300" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path></svg>
</a>
<a class="w-full bg-[#0E3929] hover:bg-[#144834] text-white rounded-xl py-3.5 px-5 font-semibold text-sm flex items-center justify-between transition-all shadow-md shadow-emerald-950/15" href="{% url 'auditors:dashboard' %}">
<span>Auditor Dashboard</span>
<svg class="w-4 h-4 text-emerald-300" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path></svg>
</a>
</div>
</div>
</main>

<footer class="w-full bg-[#082218] border-t border-emerald-950 py-3.5 px-6 text-xs text-emerald-100/75">
<div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-center sm:text-left">
<div class="text-[11px] tracking-wide text-emerald-200/80">© 2026 Kenyan Electronic Voting System (student project). <span class="text-emerald-400/90 font-medium">Final-year academic proof-of-concept — not affiliated with IEBC.</span></div>
<span class="inline-flex items-center gap-1.5 text-emerald-300 font-semibold text-[11px] uppercase tracking-wider">TLS 1.3</span>
</div>
</footer>
</body>
</html>
