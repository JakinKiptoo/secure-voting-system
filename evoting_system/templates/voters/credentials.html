{% extends "base.html" %}
{% block title %}Login &mdash; Electronic Voting System{% endblock %}
{% block content %}
  <h1>Voter Login</h1>
  <p class="badge">Secure Government System</p>
  <p>Enter your National ID and phone number. We'll send a one-time PIN to your registered phone.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Continue</button>
  </form>
{% endblock %}
